<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Получить номер телефона</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f7fa;
        flex-direction: column;
        padding: 20px;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 40px 30px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        color: #1e293b;
        margin-top: 0;
        margin-bottom: 8px;
      }
      .sub {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 24px;
      }
      button {
        width: 100%;
        padding: 16px 24px;
        font-size: 18px;
        font-weight: 600;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.15s;
        touch-action: manipulation;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:active {
        transform: scale(0.97);
      }
      #os-info {
        margin: 12px 0 8px;
        font-size: 14px;
        color: #475569;
      }
      #result {
        margin-top: 24px;
        padding: 16px;
        border-radius: 12px;
        background: #f1f5f9;
        min-height: 60px;
        font-size: 15px;
        word-break: break-word;
        color: #0f172a;
      }
      .number-item {
        background: white;
        padding: 8px 12px;
        margin: 6px 0;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        font-family: "Courier New", monospace;
        font-size: 16px;
      }
      .error {
        color: #dc2626;
      }
      .success {
        color: #16a34a;
      }
      .info {
        color: #f59e0b;
      }
      hr {
        margin: 20px 0;
        border: none;
        border-top: 1px solid #e2e8f0;
      }

      .btn-vk {
        background: #4c75a3;
        margin-bottom: 12px;
      }
      .btn-vk:hover {
        background: #3b5f8a;
      }

      .btn-max {
        background: #ff6b00;
        margin-top: 12px;
      }
      .btn-max:hover {
        background: #e55d00;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>📱 Получение номера</h1>
      <div class="sub">Авторизуйтесь через один из сервисов</div>

      <div id="os-info">Определение ОС...</div>

      <!-- VK ID -->
      <button id="vkLoginBtn" class="btn-vk">Войти через VK ID</button>

      <!-- Т-Банк ID (виджет) -->
      <div id="tid-container" style="margin: 16px 0"></div>

      <!-- Сбер ID (официальный виджет через SDK) -->
      <div id="sberIdContainer" style="margin: 16px 0"></div>

      <!-- MAX (кастомная кнопка) -->
      <button id="maxLoginBtn" class="btn-max">Войти через MAX</button>

      <hr />

      <!-- Альтернативный способ (контакты / Google) -->
      <button id="getPhoneBtn">Получить номер (контакты / Google)</button>

      <div id="result">
        <span style="color: #94a3b8">Нажмите кнопку, чтобы начать</span>
      </div>
    </div>

    <!-- ===== VK ID SDK ===== -->
    <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
    <script>
      (function () {
        if (!("VKIDSDK" in window)) {
          document.getElementById("result").innerHTML = `
            <div class="error">❌ SDK VK ID не загружен. Проверьте интернет.</div>
          `;
          return;
        }

        const VKID = window.VKIDSDK;

        VKID.Config.init({
          app: 54663710,
          redirectUrl: "https://oyoha.github.io/get_number/callback.html",
          responseMode: VKID.ConfigResponseMode.Callback,
          source: VKID.ConfigSource.LOWCODE,
          scope: "phone",
        });

        document
          .getElementById("vkLoginBtn")
          .addEventListener("click", function () {
            VKID.Auth.login({
              client_id: 54663710,
              redirect_uri: "https://oyoha.github.io/get_number/callback.html",
              scope: "phone",
              response_type: "token",
              state: "vk",
            });
          });
      })();
    </script>

    <!-- ===== Т-Банк ID ===== -->
    <script src="https://sso-forms-prod.t-static.ru/tid/widget.js"></script>
    <script>
      (function () {
        if (typeof TidSDK === "undefined") {
          console.warn("Виджет Т-Банк не загружен");
          return;
        }

        const authParams = {
          redirectUri: "https://oyoha.github.io/get_number/callback.html",
          responseType: "token",
          clientId: "ВАШ_CLIENT_ID_ТБАНКА",
          state: "tbank",
        };

        const uiParams = {
          container: "#tid-container",
          size: "l",
          color: "primary",
          text: "Т-Банк",
          target: "_self",
        };

        const tidSdk = new TidSDK(authParams);
        tidSdk.addButton(uiParams);
      })();
    </script>

    <!-- ===== Сбер ID (официальный SDK) ===== -->
    <script src="https://id.sber.ru/sdk/web/sberid-sdk.production.js"></script>
    <script>
      (function () {
        if (typeof SberidSDK === "undefined") {
          console.warn("SDK Сбера не загружен");
          document.getElementById("result").innerHTML = `
            <div class="error">❌ SDK Сбер ID не загружен. Проверьте интернет.</div>
          `;
          return;
        }

        // Генерируем случайный nonce для безопасности
        function generateNonce() {
          return (
            Math.random().toString(36).substring(2, 15) +
            Math.random().toString(36).substring(2, 15)
          );
        }

        const sdk = new SberidSDK({
          oidc: {
            client_id: "ВАШ_CLIENT_ID_СБЕРА", // замените на свой
            client_type: "PRIVATE",
            nonce: generateNonce(),
            redirect_uri: "https://oyoha.github.io/get_number/callback.html",
            state: "sber",
            scope: "openid name phone",
            response_type: "code",
            name: "Получение номера",
          },
          notification: {
            enable: false,
          },
          container: "#sberIdContainer",
          onSuccessCallback: function ({ state, code }) {
            console.log("Сбер ID успех, code:", code);
            fetch("/exchange-sber-code", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code, state }),
            })
              .then((res) => {
                if (!res.ok) throw new Error("Ошибка сервера");
                return res.json();
              })
              .then((data) => {
                document.getElementById("result").innerHTML = `
                <div class="success">✅ Номер получен через Сбер ID</div>
                <div class="number-item">📞 ${data.phone}</div>
              `;
              })
              .catch((err) => {
                document.getElementById("result").innerHTML = `
                <div class="error">❌ Ошибка получения номера: ${err.message}</div>
              `;
              });
          },
          onErrorCallback: function (error) {
            console.error("Сбер ID ошибка:", error);
            document.getElementById("result").innerHTML = `
              <div class="error">❌ Ошибка авторизации Сбера: ${error}</div>
            `;
          },
        });

        sdk
          .init()
          .then(() => {
            console.log("SDK Сбера инициализирован");
          })
          .catch((err) => {
            console.error("Ошибка инициализации SDK Сбера:", err);
            document.getElementById("result").innerHTML = `
              <div class="error">❌ Ошибка инициализации SDK Сбера: ${err.message}</div>
            `;
          });
      })();
    </script>

    <!-- ===== MAX (прямой переход в бота) ===== -->
    <script>
      (function () {
        const MAX_BOT_URL = "https://max.ru/id4205025388_1_bot"; // Замените на реальную ссылку на вашего бота

        document
          .getElementById("maxLoginBtn")
          .addEventListener("click", function () {
            // Генерируем уникальный код авторизации
            const authCode =
              Math.random().toString(36).substring(2, 15) +
              Math.random().toString(36).substring(2, 15);

            // Сохраняем код в сессионное хранилище (или глобально)
            sessionStorage.setItem("maxAuthCode", authCode);

            // Формируем ссылку на бота с параметром авторизации
            // Обычно бот может принимать параметр start или другой
            const botLink = `${MAX_BOT_URL}?start=auth_${authCode}`;

            // Открываем ссылку в новом окне или текущем
            window.open(botLink, "_blank");

            // Показываем инструкцию пользователю
            document.getElementById("result").innerHTML = `
              <div class="info">🔑 Код авторизации сгенерирован:</div>
              <div style="font-family: monospace; font-size: 18px; margin: 12px 0; background: #e2e8f0; padding: 8px; border-radius: 8px;">${authCode}</div>
              <div style="font-size: 14px; color: #475569;">
                Перейдите в бота MAX и подтвердите вход.<br>
                После подтверждения вернитесь на сайт и <strong>обновите страницу</strong>.
              </div>
              <div style="margin-top: 12px; font-size: 13px; color: #64748b;">
                (В реальном проекте бот отправит подтверждение на сервер, и номер телефона будет получен автоматически)
              </div>
            `;
          });
      })();
    </script>

    <!-- ===== Старый функционал (WebToNative + Contact Picker) ===== -->
    <script src="https://unpkg.com/webtonative@1.1.6/webtonative.min.js"></script>
    <script>
      (function () {
        "use strict";

        const resultDiv = document.getElementById("result");
        const osInfo = document.getElementById("os-info");
        const btn = document.getElementById("getPhoneBtn");

        function getOSType() {
          const ua = navigator.userAgent || navigator.vendor || window.opera;
          if (/android/i.test(ua)) return "Android";
          if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "iOS";
          return "Desktop";
        }

        const os = getOSType();
        osInfo.textContent = `Операционная система: ${os}`;

        let useContactPicker = false;

        function getContactsPicker() {
          if (!("contacts" in navigator) || !("ContactsManager" in window)) {
            resultDiv.innerHTML = `
              <div class="error">❌ Ваш браузер не поддерживает Contact Picker.</div>
              <div style="font-size:13px; color:#64748b; margin-top:8px;">
                Попробуйте Chrome на Android или Safari на iOS (с включённым экспериментальным флагом).
              </div>
            `;
            return Promise.reject(new Error("Contact Picker not supported"));
          }

          resultDiv.innerHTML = "⏳ Открывается список контактов...";

          return navigator.contacts
            .select(["tel"], { multiple: true })
            .then((contacts) => {
              if (!contacts || contacts.length === 0) {
                resultDiv.innerHTML = "ℹ️ Вы не выбрали ни одного контакта.";
                return Promise.reject(new Error("No contacts selected"));
              }

              let allNumbers = [];
              for (const contact of contacts) {
                if (contact.tel && contact.tel.length > 0) {
                  allNumbers = allNumbers.concat(contact.tel);
                }
              }

              if (allNumbers.length === 0) {
                resultDiv.innerHTML =
                  "ℹ️ В выбранных контактах нет телефонных номеров.";
                return Promise.reject(new Error("No phone numbers found"));
              }

              let html = `<div class="success">✅ Получено номеров (из контактов): ${allNumbers.length}</div>`;
              html += allNumbers
                .map((num) => `<div class="number-item">📞 ${num}</div>`)
                .join("");
              resultDiv.innerHTML = html;
              return allNumbers;
            })
            .catch((error) => {
              console.error("Contact Picker error:", error);
              let msg = error.message || "Неизвестная ошибка";
              if (
                error.name === "AbortError" ||
                error.name === "NotAllowedError"
              ) {
                msg = "Доступ к контактам запрещён или диалог закрыт.";
              }
              resultDiv.innerHTML = `<div class="error">❌ Ошибка Contact Picker: ${msg}</div>`;
              return Promise.reject(error);
            });
        }

        function getPhoneNumber() {
          if (useContactPicker) {
            getContactsPicker().catch(() => {});
            return;
          }

          if (os === "Desktop") {
            resultDiv.innerHTML = `
              <div class="error">❌ Получение номера доступно только на мобильных устройствах.</div>
              <div style="font-size:13px; color:#64748b; margin-top:8px;">
                Откройте страницу на Android или iOS.
              </div>
            `;
            return;
          }

          if (os === "iOS") {
            getContactsPicker().catch(() => {});
            return;
          }

          if (
            typeof window.WTN === "undefined" ||
            !window.WTN.getDevicePhoneNumber
          ) {
            resultDiv.innerHTML =
              "⚠️ WebToNative не загружен. Попробуйте выбрать из контактов.";
            useContactPicker = true;
            btn.textContent = "Выбрать из контактов";
            return;
          }

          let wtnFinished = false;
          let timeoutId = null;

          resultDiv.innerHTML = "⏳ Пробуем получить номер через Google...";

          try {
            window.WTN.getDevicePhoneNumber({
              callback: function (response) {
                if (wtnFinished) return;
                wtnFinished = true;
                clearTimeout(timeoutId);

                if (response.success && response.phoneNumber) {
                  resultDiv.innerHTML = `
                    <div class="success">✅ Номер получен (через Google):</div>
                    <div class="number-item">📞 ${response.phoneNumber}</div>
                  `;
                  useContactPicker = false;
                  btn.textContent = "Получить номер";
                } else {
                  let errorMsg = response.error || "Неизвестная ошибка";
                  if (response.error_code === "USER_CANCELED") {
                    errorMsg = "Вы отменили выбор номера Google.";
                  }
                  resultDiv.innerHTML = `
                    <div class="error">❌ Ошибка Google: ${errorMsg}</div>
                    <div style="font-size:13px; color:#64748b; margin-top:8px;">
                      Попробуйте выбрать номер из контактов.
                    </div>
                  `;
                  useContactPicker = true;
                  btn.textContent = "Выбрать из контактов";
                }
              },
            });
          } catch (e) {
            if (wtnFinished) return;
            wtnFinished = true;
            clearTimeout(timeoutId);
            resultDiv.innerHTML = `
              <div class="error">❌ Ошибка вызова WTN: ${e.message}</div>
              <div style="font-size:13px; color:#64748b; margin-top:8px;">
                Попробуйте выбрать номер из контактов.
              </div>
            `;
            useContactPicker = true;
            btn.textContent = "Выбрать из контактов";
          }

          timeoutId = setTimeout(() => {
            if (wtnFinished) return;
            wtnFinished = true;
            resultDiv.innerHTML = `
              <div class="info">⏱️ Время ожидания Google истекло (5 сек).</div>
              <div style="font-size:13px; color:#64748b; margin-top:8px;">
                Попробуйте выбрать номер из контактов.
              </div>
            `;
            useContactPicker = true;
            btn.textContent = "Выбрать из контактов";
          }, 5000);
        }

        btn.addEventListener("click", getPhoneNumber);

        if (os === "Desktop") {
          resultDiv.innerHTML = `
            <div style="color:#94a3b8; font-size:14px;">
              Получение номера доступно только на Android и iOS.<br>
              Откройте страницу на смартфоне.
            </div>
          `;
        }
      })();
    </script>
  </body>
</html>
