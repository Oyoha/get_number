<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обработка авторизации VK ID</title>
  </head>
  <body>
    <h1>Обработка авторизации...</h1>
    <pre id="result"></pre>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const payload = urlParams.get("payload");

      const resultDiv = document.getElementById("result");

      if (payload) {
        try {
          const decodedPayload = atob(
            payload.replace(/_/g, "/").replace(/-/g, "+"),
          );
          const data = JSON.parse(decodedPayload);
          resultDiv.textContent =
            "Данные пользователя: " + JSON.stringify(data, null, 2);
        } catch (e) {
          resultDiv.textContent = "Ошибка при обработке данных: " + e.message;
        }
      } else {
        resultDiv.textContent = "Не удалось получить данные авторизации.";
      }
    </script>
  </body>
</html>
